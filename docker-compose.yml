name: hadoop-hive-lab

services:
  namenode-init:
    build: ./hadoop
    container_name: lab-namenode-init
    hostname: namenode-init
    user: root
    entrypoint: ["/bin/bash", "-lc"]
    command: >-
      set -e;
      mkdir -p /data/nn;
      chown -R hadoop:users /data/nn;
      if [ ! -f /data/nn/current/VERSION ]; then
        su -s /bin/bash hadoop -c 'hdfs namenode -format -force -nonInteractive';
      else
        echo 'NameNode already formatted.';
      fi
    volumes:
      - hadoop_nn:/data/nn
    restart: "no"

  namenode:
    build: ./hadoop
    container_name: lab-namenode
    hostname: namenode
    user: root
    depends_on:
      namenode-init:
        condition: service_completed_successfully
    entrypoint: ["/bin/bash", "-lc"]
    command: "exec su -s /bin/bash hadoop -c 'hdfs namenode'"
    volumes:
      - hadoop_nn:/data/nn
    ports:
      - "9870:9870"
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'su -s /bin/bash hadoop -c \"hdfs dfsadmin -report >/dev/null 2>&1\"'"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 15s
    restart: unless-stopped

  datanode:
    build: ./hadoop
    container_name: lab-datanode
    hostname: datanode
    user: root
    depends_on:
      namenode:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-lc"]
    command: "mkdir -p /data/dn && chown -R hadoop:users /data/dn && exec su -s /bin/bash hadoop -c 'hdfs datanode'"
    volumes:
      - hadoop_dn:/data/dn
    restart: unless-stopped

  resourcemanager:
    build: ./hadoop
    container_name: lab-resourcemanager
    hostname: resourcemanager
    user: root
    depends_on:
      namenode:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-lc"]
    command: "exec su -s /bin/bash hadoop -c 'yarn resourcemanager'"
    ports:
      - "8088:8088"
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'curl -fsS http://127.0.0.1:8088/ws/v1/cluster/info >/dev/null'"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
    restart: unless-stopped

  nodemanager:
    build: ./hadoop
    container_name: lab-nodemanager
    hostname: nodemanager
    user: root
    depends_on:
      resourcemanager:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-lc"]
    command: "mkdir -p /data/yarn/local /data/yarn/logs && chown -R hadoop:users /data/yarn && exec su -s /bin/bash hadoop -c 'yarn nodemanager'"
    volumes:
      - hadoop_yarn:/data/yarn
    restart: unless-stopped

  historyserver:
    build: ./hadoop
    container_name: lab-historyserver
    hostname: historyserver
    user: root
    depends_on:
      namenode:
        condition: service_healthy
      resourcemanager:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-lc"]
    command: "mkdir -p /data/mr-history && chown -R hadoop:users /data/mr-history && exec su -s /bin/bash hadoop -c 'mapred historyserver'"
    volumes:
      - hadoop_history:/data/mr-history
    ports:
      - "19888:19888"
    restart: unless-stopped

  hdfs-init:
    build: ./hadoop
    container_name: lab-hdfs-init
    user: root
    hostname: hdfs-init
    depends_on:
      namenode:
        condition: service_healthy
      datanode:
        condition: service_started
    entrypoint: ["/bin/bash", "-lc"]
    command: >-
      set -e;
      for i in $(seq 1 60); do
        if su -s /bin/bash hadoop -c 'hdfs dfsadmin -report 2>/dev/null | grep -q "Live datanodes"'; then break; fi;
        sleep 2;
      done;
      su -s /bin/bash hadoop -c 'hdfs dfs -mkdir -p /user/hadoop /user/hive/warehouse /tmp /tmp/hive /data/exemple_clients /apps/tez';
      su -s /bin/bash hadoop -c 'hdfs dfs -chmod -R 777 /tmp /tmp/hive /user /data/exemple_clients /apps/tez';
      su -s /bin/bash hadoop -c 'hdfs dfs -put -f /input/clients.csv /data/exemple_clients/clients.csv';
      su -s /bin/bash hadoop -c 'hdfs dfs -ls -h /data/exemple_clients';
      echo 'HDFS bootstrap OK.'
    volumes:
      - ./clients.csv:/input/clients.csv:ro
    restart: "no"

  postgres:
    image: postgres:17-bookworm
    container_name: lab-postgres
    hostname: postgres
    environment:
      POSTGRES_DB: metastore_db
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
    volumes:
      - hive_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore_db"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  metastore:
    build: ./hive
    container_name: lab-metastore
    hostname: metastore
    depends_on:
      postgres:
        condition: service_healthy
      hdfs-init:
        condition: service_completed_successfully
    environment:
      USER: hive
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      HADOOP_CLASSPATH: /opt/hadoop/share/hadoop/tools/lib/*
      HIVE_WAREHOUSE_PATH: /opt/hive/data/warehouse
      IS_RESUME: "false"
      SERVICE_OPTS: >-
        -Xmx768m
        -Dhive.metastore.uris=thrift://metastore:9083
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/metastore_db
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hive
    volumes:
      - ./hadoop/conf:/opt/hadoop/etc/hadoop:ro
      - hive_warehouse:/opt/hive/data/warehouse
    ports:
      - "9083:9083"
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'echo > /dev/tcp/127.0.0.1/9083' 2>/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 40s
    restart: unless-stopped

  tez-init:
    image: apache/hive:4.2.1
    container_name: lab-tez-init
    hostname: tez-init
    depends_on:
      hdfs-init:
        condition: service_completed_successfully
    environment:
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
    entrypoint: ["/bin/bash", "-lc"]
    command: >-
      set -e;
      test -d /opt/tez;
      tar -C /opt -czf /tmp/tez.tar.gz tez;
      hdfs dfs -mkdir -p /apps/tez;
      hdfs dfs -put -f /tmp/tez.tar.gz /apps/tez/tez.tar.gz;
      hdfs dfs -chmod 644 /apps/tez/tez.tar.gz;
      echo 'Tez 0.10.5 archive deployed to HDFS.'
    volumes:
      - ./hadoop/conf:/opt/hadoop/etc/hadoop:ro
    restart: "no"

  zookeeper:
    image: zookeeper:3.8.4
    container_name: lab-zookeeper
    hostname: zookeeper
    environment:
      ZOO_4LW_COMMANDS_WHITELIST: ruok
    volumes:
      - zk_data:/data
      - zk_datalog:/datalog
      - zk_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 127.0.0.1 2181 | grep -q imok"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  llapdaemon:
    image: apache/hive:4.2.1
    container_name: lab-llapdaemon
    hostname: llapdaemon
    depends_on:
      zookeeper:
        condition: service_healthy
      hdfs-init:
        condition: service_completed_successfully
    environment:
      USER: hive
      SERVICE_NAME: llap
      LLAP_MEMORY_MB: "768"
      LLAP_EXECUTORS: "1"
      HIVE_SCRATCH_DIR: /opt/hive/scratch
      HIVE_QUERY_RESULTS_CACHE_DIRECTORY: /opt/hive/scratch/_resultscache_
      LOCAL_DIRS: /tmp/llap-local
      LLAP_WEB_PORT: "15001"
      LLAP_MANAGEMENT_RPC_PORT: "15004"
      LLAP_SHUFFLE_PORT: "15551"
      HIVE_ZOOKEEPER_QUORUM: zookeeper:2181
      DEFAULT_FS: hdfs://namenode:8020
      HADOOP_CLASSPATH: /opt/hadoop/share/hadoop/tools/lib/*
    volumes:
      - ./hadoop/conf:/opt/hadoop/etc/hadoop:ro
      - hive_warehouse:/opt/hive/data/warehouse
      - hive_scratch:/opt/hive/scratch
    ports:
      - "15001:15001"
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'echo > /dev/tcp/127.0.0.1/15001' 2>/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 40s
    restart: unless-stopped

  hiveserver2:
    image: apache/hive:4.2.1
    container_name: lab-hiveserver2
    hostname: hiveserver2
    depends_on:
      metastore:
        condition: service_healthy
      tez-init:
        condition: service_completed_successfully
      llapdaemon:
        condition: service_healthy
      resourcemanager:
        condition: service_healthy
      nodemanager:
        condition: service_started
    environment:
      USER: hive
      SERVICE_NAME: hiveserver2
      IS_RESUME: "true"
      HIVE_SERVER2_THRIFT_PORT: "10000"
      HADOOP_CLASSPATH: /opt/hadoop/share/hadoop/tools/lib/*
      HIVE_SCRATCH_DIR: /opt/hive/scratch
      HIVE_QUERY_RESULTS_CACHE_DIRECTORY: /opt/hive/scratch/_resultscache_
      DEFAULT_FS: hdfs://namenode:8020
      HIVE_ZOOKEEPER_QUORUM: zookeeper:2181
      HIVE_LLAP_DAEMON_SERVICE_HOSTS: "@llap0"
      HIVE_SERVER2_TEZ_USE_EXTERNAL_SESSIONS: "false"
      TEZ_FRAMEWORK_MODE: ""
      DB_DRIVER: postgres
      SERVICE_OPTS: >-
        -Xmx1G
        -Dhive.metastore.uris=thrift://metastore:9083
        -Dhive.execution.mode=container
    volumes:
      - ./hadoop/conf:/opt/hadoop/etc/hadoop:ro
      - ./hive/custom-conf:/opt/custom-conf:ro
      - hive_warehouse:/opt/hive/data/warehouse
      - hive_scratch:/opt/hive/scratch
    ports:
      - "10000:10000"
      - "10002:10002"
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'echo > /dev/tcp/127.0.0.1/10000' 2>/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 40
      start_period: 45s
    restart: unless-stopped

  lab-init:
    image: apache/hive:4.2.1
    container_name: lab-init
    depends_on:
      hiveserver2:
        condition: service_healthy
    volumes:
      - ./hadoop/conf:/opt/hadoop/etc/hadoop:ro
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/bash", "/scripts/init-hive.sh"]
    restart: "no"

  smoke-test:
    image: apache/hive:4.2.1
    container_name: lab-smoke-test
    depends_on:
      lab-init:
        condition: service_completed_successfully
    volumes:
      - ./hadoop/conf:/opt/hadoop/etc/hadoop:ro
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/bash", "/scripts/smoke-test.sh"]
    restart: "no"

networks:
  default:
    name: hadoop-hive-lab

volumes:
  hadoop_nn:
  hadoop_dn:
  hadoop_yarn:
  hadoop_history:
  hive_db:
  hive_warehouse:
  hive_scratch:
  zk_data:
  zk_datalog:
  zk_logs:
