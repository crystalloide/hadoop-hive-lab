services:
  hadoop:
    build: ./hadoop
    hostname: hadoop
    container_name: lab-hadoop
    environment:
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
      HADOOP_HOME: /opt/hadoop
      HADOOP_HDFS_HOME: /opt/hadoop
      HADOOP_YARN_HOME: /opt/hadoop
      HADOOP_MAPRED_HOME: /opt/hadoop
      JAVA_HOME: /usr/lib/jvm/jre/
    ports:
      - "9870:9870"
      - "8088:8088"
      - "19888:19888"
    volumes:
      - hadoop_nn:/data/nn
      - hadoop_dn:/data/dn
      - hadoop_yarn:/data/yarn
      - hadoop_history:/data/mr-history
    healthcheck:
      test: ["CMD-SHELL", "su -s /bin/bash hadoop -c 'hdfs dfsadmin -report >/dev/null 2>&1 && yarn node -list 2>/dev/null | grep -q RUNNING'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  hdfs-init:
    build: ./hadoop
    container_name: lab-hdfs-init
    depends_on:
      hadoop:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-lc"]
    command: >
      "set -e;
      mkdir -p /tmp/tez;
      curl -fsSL https://dlcdn.apache.org/tez/0.10.5/apache-tez-0.10.5-bin.tar.gz -o /tmp/tez/tez.tar.gz;
      su -s /bin/bash hadoop -c 'hdfs dfs -mkdir -p /apps/tez /user/hadoop /user/hive/warehouse /tmp/hive';
      su -s /bin/bash hadoop -c 'hdfs dfs -chmod -R 777 /apps /user /tmp/hive';
      su -s /bin/bash hadoop -c 'hdfs dfs -put -f /tmp/tez/tez.tar.gz /apps/tez/tez.tar.gz';
      su -s /bin/bash hadoop -c 'hdfs dfs -ls -h /apps/tez/tez.tar.gz';
      echo 'HDFS + Tez artifacts initialized.'"
    environment:
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
      HADOOP_HOME: /opt/hadoop
      HADOOP_HDFS_HOME: /opt/hadoop
      HADOOP_YARN_HOME: /opt/hadoop
      HADOOP_MAPRED_HOME: /opt/hadoop
    restart: "no"

  postgres:
    image: postgres:17-bookworm
    container_name: lab-postgres
    environment:
      POSTGRES_DB: metastore_db
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
    volumes:
      - hive_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  metastore:
    build: ./hive
    container_name: lab-metastore
    hostname: metastore
    depends_on:
      postgres:
        condition: service_healthy
      hdfs-init:
        condition: service_completed_successfully
    environment:
      USER: hive
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      HIVE_CUSTOM_CONF_DIR: /hive_custom_conf
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
      HADOOP_CLASSPATH: /opt/hadoop/share/hadoop/tools/lib/*
      SERVICE_OPTS: >-
        -Xmx768m
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/metastore_db
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hive
    volumes:
      - ./hadoop/conf:/opt/hadoop/etc/hadoop:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9083'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  zookeeper:
    image: zookeeper:3.8.4
    container_name: lab-zookeeper
    hostname: zookeeper
    environment:
      ZOO_4LW_COMMANDS_WHITELIST: ruok
    volumes:
      - zk_data:/data
      - zk_datalog:/datalog
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 127.0.0.1 2181 | grep -q imok"]
      interval: 5s
      timeout: 3s
      retries: 20

  tezam:
    build: ./hive
    container_name: lab-tezam
    hostname: tezam
    depends_on:
      zookeeper:
        condition: service_healthy
      hdfs-init:
        condition: service_completed_successfully
    environment:
      USER: hive
      HIVE_CUSTOM_CONF_DIR: /hive_custom_conf
      SERVICE_NAME: tezam
      TEZ_FRAMEWORK_MODE: STANDALONE_ZOOKEEPER
      TEZ_AM_ZOOKEEPER_QUORUM: zookeeper:2181
      TEZ_AM_RPC_PORT: "15100"
      # Tez 0.10.5 expects these YARN container variables even when the
      # Tez AM is launched directly in STANDALONE_ZOOKEEPER mode.
      CONTAINER_ID: "container_e01_0001_01_000001"
      NM_HOST: "tezam"
      NM_PORT: "8040"
      NM_HTTP_PORT: "8042"
      PWD: "/tmp"
      HIVE_ZOOKEEPER_QUORUM: zookeeper:2181
      HIVE_LLAP_DAEMON_SERVICE_HOSTS: "@llap0"
      DEFAULT_FS: hdfs://hadoop:8020
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
      HADOOP_CLASSPATH: /opt/hadoop/share/hadoop/tools/lib/*
      HIVE_SCRATCH_DIR: /opt/hive/scratch
      HIVE_QUERY_RESULTS_CACHE_DIRECTORY: /opt/hive/scratch/_resultscache_
    volumes:
      - ./hadoop/conf:/opt/hadoop/etc/hadoop:ro
      - hive_warehouse:/opt/hive/data/warehouse
      - hive_scratch:/opt/hive/scratch
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/15100'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  llapdaemon:
    build: ./hive
    container_name: lab-llapdaemon
    hostname: llapdaemon
    depends_on:
      zookeeper:
        condition: service_healthy
      hdfs-init:
        condition: service_completed_successfully
    environment:
      USER: hive
      HIVE_CUSTOM_CONF_DIR: /hive_custom_conf
      SERVICE_NAME: llap
      LLAP_MEMORY_MB: "768"
      LLAP_EXECUTORS: "1"
      HIVE_SCRATCH_DIR: /opt/hive/scratch
      HIVE_QUERY_RESULTS_CACHE_DIRECTORY: /opt/hive/scratch/_resultscache_
      LOCAL_DIRS: /tmp/llap-local
      LLAP_WEB_PORT: "15001"
      LLAP_MANAGEMENT_RPC_PORT: "15004"
      LLAP_SHUFFLE_PORT: "15551"
      HIVE_ZOOKEEPER_QUORUM: zookeeper:2181
      DEFAULT_FS: hdfs://hadoop:8020
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
      HADOOP_CLASSPATH: /opt/hadoop/share/hadoop/tools/lib/*
    volumes:
      - ./hadoop/conf:/opt/hadoop/etc/hadoop:ro
      - hive_warehouse:/opt/hive/data/warehouse
      - hive_scratch:/opt/hive/scratch
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/15001'"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s

  hiveserver2:
    build: ./hive
    container_name: lab-hiveserver2
    hostname: hiveserver2
    depends_on:
      metastore:
        condition: service_healthy
      tezam:
        condition: service_healthy
      llapdaemon:
        condition: service_healthy
    environment:
      USER: hive
      SERVICE_NAME: hiveserver2
      IS_RESUME: "true"
      DB_DRIVER: postgres
      HIVE_CUSTOM_CONF_DIR: /hive_custom_conf
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
      HADOOP_CLASSPATH: /opt/hadoop/share/hadoop/tools/lib/*
      HIVE_ZOOKEEPER_QUORUM: zookeeper:2181
      HIVE_LLAP_DAEMON_SERVICE_HOSTS: "@llap0"
      HIVE_SERVER2_TEZ_USE_EXTERNAL_SESSIONS: "true"
      TEZ_FRAMEWORK_MODE: STANDALONE_ZOOKEEPER
      DEFAULT_FS: hdfs://hadoop:8020
      SERVICE_OPTS: >-
        -Xmx1G
        -Dhive.metastore.uris=thrift://metastore:9083
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/metastore_db
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hive
    volumes:
      - ./hadoop/conf:/opt/hadoop/etc/hadoop:ro
      - hive_warehouse:/opt/hive/data/warehouse
      - hive_scratch:/opt/hive/scratch
    ports:
      - "10000:10000"
      - "10002:10002"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/10000'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  smoke-test:
    build: ./hive
    container_name: lab-smoke-test
    depends_on:
      hiveserver2:
        condition: service_healthy
    environment:
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
      HADOOP_CLASSPATH: /opt/hadoop/share/hadoop/tools/lib/*
    volumes:
      - ./hadoop/conf:/opt/hadoop/etc/hadoop:ro
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/bash", "/scripts/smoke-test.sh"]
    restart: "no"

volumes:
  hadoop_nn:
  hadoop_dn:
  hadoop_yarn:
  hadoop_history:
  hive_db:
  hive_warehouse:
  hive_scratch:
  zk_data:
  zk_datalog:
